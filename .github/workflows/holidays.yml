name: 공휴일 갱신
on:
  schedule:
    - cron: '17 18 * * *'   # 매일 03:17(한국)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_holidays.py holidays.json
      - name: 바뀌었으면 올리기(+ 한 달에 한 번은 살아 있다는 표시 — 60일 조용하면 GitHub 이 예약 실행을 끈다)
        run: |
          git config user.name "holiday-bot"
          git config user.email "holiday-bot@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2160000 ]; then date -u +%F > .last-check; git add .last-check; fi
          git add holidays.json
          git diff --cached --quiet || (git commit -m "공휴일 갱신 $(date -u +%F)" && git push)
