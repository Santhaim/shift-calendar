<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 확대 막기(10-13 사용자 요청) — 안드로이드는 이 줄, 아이폰은 아래 CSS touch-action + gesturestart 차단 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<title>근무달력</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- 아이폰: 홈 화면 아이콘으로 열면 주소창 없이(예전 iOS 는 이 줄이 있어야 앱 화면) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무달력">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#fff;--fg:#1f2328;--sub:#8b9096;--line:#eceef1;--soft:#f4f5f7;--sun:#e5484d;--sat:#2f6fec;--accent:#1677ff;--sel:#e8f1ff;--holbg:#ffe1e5;--mine:#fffbe6;--sheet:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--fg:#e9eaec;--sub:#8a8f98;--line:#2a2c31;--soft:#1f2125;--sun:#ff6b70;--sat:#6e9bff;--accent:#4d94ff;--sel:#1b2a44;--holbg:#3a1f25;--mine:#26230f;--sheet:#1c1e22}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{max-width:640px;margin:0 auto;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:2px;padding:calc(10px + env(safe-area-inset-top)) 10px 8px;height:calc(56px + env(safe-area-inset-top))}
.top h1{margin:0}
#title{font-size:23px;font-weight:800;letter-spacing:-.5px;padding:4px 6px;border-radius:8px}
#title:active{background:var(--soft)}
.icon-btn{width:38px;height:38px;font-size:28px;line-height:1;border-radius:50%;color:var(--sub)}
.pill{margin-left:auto;padding:7px 14px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:700}
.top.noNav .icon-btn,.top.noNav .pill{visibility:hidden}
.tab{display:none}.tab.active{display:block}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);position:sticky;top:calc(56px + env(safe-area-inset-top));background:var(--bg);z-index:4}
.dow span:first-child{color:var(--sun)}.dow span:last-child{color:var(--sat)}
/* 내 달력 = 한 화면에 꽉 차게(높이는 fitCal 이 --calH 로 준다) */
#tab-cal.active{display:flex;flex-direction:column;height:var(--calH,auto)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);flex:1;min-height:0}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;min-height:0;overflow:hidden;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.grid.w6 .memo{-webkit-line-clamp:2}
.mcolors{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.mc{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.mc:first-child{width:auto;padding:0 10px;border-radius:16px;background:var(--soft);font-size:12px;color:var(--sub)}
.mc.on{border-color:var(--bg);box-shadow:0 0 0 2.5px var(--fg)}
.cell:nth-child(7n){border-right:0}
.cell.out>*{opacity:.35}
.cell.today{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
.dn{align-self:stretch;display:flex;align-items:center;gap:2px;font-size:13px;padding:1px 3px;border-radius:4px;min-height:19px;font-weight:600}
.dn.sun{color:var(--sun)}.dn.sat{color:var(--sat)}.dn.holi{background:var(--holbg);color:var(--sun)}
.hol{font-size:9.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:auto}
.hol.anni,.th small.anni{color:var(--sub)}
.sh{position:relative;display:flex;justify-content:center;min-height:34px}
.ov{position:absolute;top:-2px;right:-7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.b{display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;line-height:1}
.b.fill{width:34px;height:34px;border-radius:50%;font-size:16px}
.b.text{height:34px;min-width:20px;font-size:18px}
.b.sm.fill{width:26px;height:26px;font-size:13px}.b.sm.text{height:26px;font-size:15px}
.memo{align-self:stretch;font-size:10px;line-height:1.3;background:var(--soft);border-radius:4px;padding:2px 3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;white-space:pre-wrap}
.stats{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.stats .st{display:flex;align-items:center;gap:6px}
.stats .t{color:var(--sub);font-size:13px}
/* 월별 메모 칸은 10-16 사용자 요청으로 뺐다(그 자리만큼 달력 칸이 커짐) · 예전 데이터 S.monthMemos 는 지우지 않고 둔다 */
/* 년·월 휠 */
.wheels{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1fr;height:220px;margin-top:14px;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel{overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel .sp{height:88px}
.wi{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:22px;color:var(--sub);cursor:pointer}
.wi.on{color:var(--fg);font-weight:800;font-size:26px}
.wsel{position:absolute;left:8px;right:8px;top:88px;height:44px;border-radius:10px;background:var(--soft);z-index:-1}
.calrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.calrow:last-of-type{border-bottom:0}
.calrow input{width:20px;height:20px;flex:none}
.calrow .nm{flex:1;min-width:0}
.calrow .nm small{display:block;color:var(--sub);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 근무자 표 */
.team-dow{display:grid;grid-template-columns:78px repeat(7,1fr);text-align:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);position:sticky;top:calc(56px + env(safe-area-inset-top));background:var(--bg);z-index:4}
.team-dow span:nth-child(2){color:var(--sun)}.team-dow span:last-child{color:var(--sat)}
.tw{border-bottom:6px solid var(--soft)}
.trow{display:grid;grid-template-columns:78px repeat(7,1fr);min-height:44px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow.head{min-height:28px;font-size:13px;font-weight:600}
.trow.mine{background:var(--mine)}
.tname{font-size:12.5px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);display:flex;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* 근무자 순서 바꾸기 — 이름을 길게 눌러 끌기 */
.trow.dragrow{background:var(--sel);box-shadow:0 4px 16px rgba(0,0,0,.28);position:relative;z-index:3;outline:2px solid var(--accent);outline-offset:-2px}
body.dragging{user-select:none;-webkit-user-select:none}
/* 앱 전체 글자 선택·길게 누르기 메뉴 막기(10-13 · 크롬이 길게 누르기를 글자 선택으로 가져가 끌기가 안 됨) — 입력 칸만 예외 */
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
.ver{text-align:center;font-size:11px;color:var(--sub);margin:4px 0 18px}
.team-hint{font-size:12px;color:var(--sub);text-align:center;margin:4px 14px 0}
.tc,.th{display:flex;justify-content:center;align-items:center;min-width:0;cursor:pointer}
.th{gap:2px;padding:0 2px;overflow:hidden}.th small{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.th.sun{color:var(--sun)}.th.sat{color:var(--sat)}
.tc.out>*,.th.out{opacity:.35}
.tc.today,.th.today{background:var(--sel)}
.empty{padding:28px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
.wide-btn{display:block;width:calc(100% - 28px);margin:14px;padding:13px;border-radius:12px;border:1.5px dashed var(--line);font-weight:700;color:var(--accent)}
/* 설정 */
.card{margin:12px 14px;padding:14px;border-radius:14px;background:var(--soft)}
.card-h{font-weight:800;font-size:15px;margin-bottom:10px}
.hint{font-size:13px;color:var(--sub);line-height:1.5;margin:0 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;display:inline-block}
.btn.danger,.danger{color:var(--sun)}
.trow2{display:grid;grid-template-columns:30px 44px 1fr 40px 62px 28px;gap:6px;align-items:center;margin-bottom:8px}
.trow2 input,.trow2 select{min-width:0;padding:8px 6px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:inherit}
.trow2 input[type=color]{padding:2px;height:36px}
.rowb{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
/* 하단 탭 */
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--sub)}
.tabs button.active{color:var(--accent);font-weight:700}
.tabs svg{width:24px;height:24px}
/* 시트 */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:20;display:flex;align-items:flex-end;justify-content:center;transition:background .2s}
.sheet-wrap[hidden]{display:none}
.sheet-wrap.open{background:rgba(0,0,0,.4)}
.sheet{width:100%;max-width:640px;max-height:90dvh;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease}
.sheet-wrap.open .sheet{transform:none}
.sh-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--holbg);color:var(--sun);line-height:1.35}
.tag.gray{background:var(--soft);color:var(--sub);font-weight:500}
.sh-title .who{font-size:13px;font-weight:600;color:var(--sub)}
.lbl{font-size:13px;color:var(--sub);margin:16px 0 8px;display:flex;align-items:center;gap:6px;font-weight:600}
.badge-ov{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--sel);color:var(--accent)}
input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:90px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:1.5px solid var(--line);font-size:12px;min-height:66px;justify-content:center}
.tbtn.sel{border-color:var(--accent);background:var(--sel)}
.tbtn .none{height:26px;display:flex;align-items:center;font-size:18px;color:var(--sub)}
.link{color:var(--accent);font-size:14px;font-weight:600;margin-top:10px}
.actions{display:flex;gap:8px;margin-top:20px}
.primary{flex:1;background:var(--accent);color:#fff;font-weight:700;padding:13px;border-radius:12px;font-size:16px}
.ghost{padding:13px 16px;border-radius:12px;background:var(--soft);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:6px;border:1.5px dashed var(--line);border-radius:12px;align-items:center}
.seq .it{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sub);padding:3px;border-radius:8px;border:2px solid transparent}
.seq .it.on{border-color:var(--accent);background:var(--sel);color:var(--accent);font-weight:700}
.sub{font-size:12px;color:var(--sub);font-weight:400}
.pv{overflow-x:auto;display:grid;grid-auto-flow:column;grid-auto-columns:36px;gap:2px;padding-bottom:4px}
.pv .c{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:3px 0;border-radius:6px}
.pv .c.today{background:var(--sel)}
.pv .c .sun{color:var(--sun)}.pv .c .sat{color:var(--sat)}
.pv .rl{font-size:10px;color:var(--sub)}
details summary{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* 날짜 창 메모 목록(하루 여러 개) */
.memo-item{margin-bottom:12px}
.memo-item .dm{min-height:0;height:64px}
.mrow{display:flex;align-items:center;gap:6px;margin-top:6px}
.mrow .mcolors{flex:1;margin-top:0;gap:5px;flex-wrap:nowrap;min-width:0}
.mrow .mc{width:24px;height:24px;flex:none}
.mrow .mc:first-child{width:auto;padding:0 8px;white-space:nowrap;font-size:11px}
.memo-del{flex:none;font-size:15px;padding:5px 9px;border-radius:8px;background:var(--holbg);color:var(--sun)}
.memo-add{display:block;width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:10px;color:var(--accent);font-weight:700;font-size:14px}
.cell .memo.one{-webkit-line-clamp:1}
.shot-btn{margin-left:4px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.shot-btn svg{width:24px;height:24px}
.shot{display:block;width:100%;max-height:58dvh;object-fit:contain;border:1px solid var(--line);border-radius:10px;margin-top:12px;background:#fff}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:120px;overflow:auto;user-select:all}
</style>
</head>
<body>
<header class="top" id="top">
  <button id="prev" class="icon-btn" aria-label="이전 달">‹</button>
  <h1><button id="title" aria-label="년·월 선택"></button></h1>
  <button id="next" class="icon-btn" aria-label="다음 달">›</button>
  <button id="todayBtn" class="pill">오늘</button>
  <button id="shotBtn" class="icon-btn shot-btn" aria-label="이미지로 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button>
</header>

<main id="main">
  <section id="tab-cal" class="tab active">
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div id="grid" class="grid"></div>
    <div id="stats" class="stats"></div>
  </section>
  <section id="tab-team" class="tab">
    <div class="team-dow"><span></span><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div id="team"></div>
    <button id="addPerson" class="wide-btn">+ 근무자 추가</button>
  </section>
  <section id="tab-set" class="tab"><div id="settings"></div></section>
</main>

<nav class="tabs">
  <button data-tab="cal" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>내 달력</span></button>
  <button data-tab="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.3c2.4.2 4 1.8 4.5 4.7"/></svg><span>근무자</span></button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg><span>설정</span></button>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<!-- 백업 불러오기용 — 설정 화면 «밖»에 고정(파일 고르고 돌아오면 설정이 다시 그려져 안에 두면 버려진다 · 10-09) -->
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY = 'shiftcal.v1';
const APP_VER = '2026.10.18-2';  // 설정 맨 아래에 보인다 — 폰에 새 판이 들어왔는지 확인용(고칠 때마다 올리기)

const DEFAULT_TYPES = [
  { id: 'D', label: '주', name: '주간', color: '#FFD400', kind: 'fill' },
  { id: 'N', label: '야', name: '야간', color: '#3A3A3A', kind: 'fill' },
  { id: 'O', label: '비', name: '비번', color: '#E0457B', kind: 'text' },
  { id: 'R', label: '휴', name: '휴무', color: '#E5484D', kind: 'text' },
  { id: 'V', label: '연', name: '연차', color: '#2E7DFF', kind: 'fill' },
  { id: 'E', label: '교', name: '교육', color: '#21A366', kind: 'fill' },
];

const PRESETS = [
  { name: '주주야야비휴', seq: ['D', 'D', 'N', 'N', 'O', 'R'] },
  { name: '주주야야휴휴', seq: ['D', 'D', 'N', 'N', 'R', 'R'] },
  { name: '주야비휴', seq: ['D', 'N', 'O', 'R'] },
  { name: '주야비', seq: ['D', 'N', 'O'] },
];

// 법정 공휴일(대체공휴일 포함) — 폰 캘린더를 못 읽을 때의 예비.
// 2026-10-04 사용자 폰의 삼성 「공휴일」 + 구글 「대한민국의 휴일」과 대조해 맞춤(노동절·제헌절 공휴일 포함).
// 빠진 날은 달력에서 날짜를 눌러 「휴일 직접 표시」로 추가.
const HOLIDAYS = {

// ---------- 날짜 ----------
const pad = n => String(n).padStart(2, '0');
const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;            // m: 0부터
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return { y, m: m - 1, d }; };
const dayNum = k => { const { y, m, d } = parseKey(k); return Math.round(Date.UTC(y, m, d) / 86400000); };
const keyFromNum = n => { const t = new Date(n * 86400000); return keyOf(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const todayKey = () => { const t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };
const dowOf = k => new Date(dayNum(k) * 86400000).getUTCDay();
const DOW = '일월화수목금토';
const md = k => { const { m, d } = parseKey(k); return `${m + 1}/${d}`; };
const ymKey = (y, m) => `${y}-${pad(m + 1)}`;

// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const safeColor = c => /^#[0-9a-fA-F]{6}$/.test(c) ? c : '#888888';
function textOn(hex) {
  const n = parseInt(safeColor(hex).slice(1), 16);
  const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return l > 0.6 ? '#222' : '#fff';
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

// ---------- 상태 ----------
function freshState() { return { v: 1, types: clone(DEFAULT_TYPES), people: [], memos: {}, memoColors: {}, monthMemos: {}, holidays: {}, calHol: {} }; }

// 날짜 메모 색 — 칸에는 옅은 바탕 + 왼쪽 색 띠(글씨는 기본색이라 다크 모드에서도 읽힘)
const MEMO_COLORS = [
  { id: '', name: '기본' },
  { id: 'red', name: '빨강', hex: '#E5484D' }, { id: 'orange', name: '주황', hex: '#F76B15' },
  { id: 'yellow', name: '노랑', hex: '#FFC53D' }, { id: 'green', name: '초록', hex: '#30A46C' },
  { id: 'sky', name: '하늘', hex: '#0090FF' }, { id: 'blue', name: '파랑', hex: '#3E63DD' },
  { id: 'purple', name: '보라', hex: '#8E4EC6' }, { id: 'pink', name: '분홍', hex: '#D6409F' },
  { id: 'gray', name: '회색', hex: '#8B8D98' },
];
const memoColor = id => (id && MEMO_COLORS.find(c => c.id === id)) || null;
// 날짜 메모 = [{t: 글, c: 색}] 최대 MEMO_MAX 개(10-18). 예전 판은 S.memos[k]=글 하나 + S.memoColors[k] → migrateMemos 가 옮긴다
const MEMO_MAX = 3;  // 10-18 사용자: 4개면 칸에서 글이 안 보여 3개로
const memosOf = k => (Array.isArray(S.memos[k]) ? S.memos[k] : []);
function migrateMemos(s) {
  const old = s.memoColors || {};
  for (const [k, v] of Object.entries(s.memos || {})) {
    if (typeof v === 'string') { if (v.trim()) s.memos[k] = [{ t: v, c: old[k] || '' }]; else delete s.memos[k]; }
    else if (!Array.isArray(v) || !v.length) delete s.memos[k];
  }
  s.memoColors = {};
  return s;
}
function memoStyle(id, field = false) {
  const c = memoColor(id);
  if (!c) return '';
  return field ? ` style="background:${c.hex}33;border-color:${c.hex}"` : ` style="background:${c.hex}4D;box-shadow:inset 3px 0 ${c.hex}"`;
}
// 안드로이드 앱 안에서 돌 때 — 네이티브 쪽에도 같이 저장(웹뷰 저장소가 늦게 써지는 것 대비)
const NATIVE = window.AndroidApp || null;
function load() {
  const tries = [];
  if (NATIVE) try { tries.push(NATIVE.restore()); } catch (e) {}
  try { tries.push(localStorage.getItem(KEY)); } catch (e) {}
  for (const raw of tries) {
    try {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.people) && Array.isArray(s.types)) return migrateMemos(Object.assign(freshState(), s));
    } catch (e) {}
  }
  return null;
}
function save() {
  const json = JSON.stringify(S);
  let ok = false;
  if (NATIVE) try { NATIVE.persist(json); ok = true; } catch (e) {}
  try { localStorage.setItem(KEY, json); ok = true; } catch (e) {}
  if (!ok) toast('저장 실패 — 저장 공간을 확인하세요');
}

let S = load();
const now = new Date();
let view = { y: now.getFullYear(), m: now.getMonth() };
let tab = 'cal';

const me = () => S.people.find(p => p.me);
const others = () => S.people.filter(p => !p.me);
const typeOf = id => S.types.find(t => t.id === id);
// 빨간 날 = 직접 표시 > 폰 캘린더 > 내장 목록. 기념일(쉬지 않는 날)은 회색 글씨만.
const holidayOf = k => S.holidays[k] || (S.calHol[k] && S.calHol[k].red.join('·')) || HOLIDAYS[k] || '';
// 웹앱 전용 «더 보기» — extras.json(법정기념일 a · 절기 s · 세시풍속 f), 설정에서 켠 것만
let EXTRAS = {};
const EXTRA_KINDS = [['a', '법정기념일', '경찰의날·스승의날 등'], ['s', '절기', '입춘·하지·동지 등 24절기'], ['f', '세시풍속', '정월대보름·단오·칠석·복날 등']];
function grayOf(k) {
  const out = [...((S.calHol[k] && S.calHol[k].other) || [])];
  const ex = EXTRAS[k], on = S.extraShow || {};
  if (ex) for (const [c] of EXTRA_KINDS) if (on[c]) for (const t of ex[c] || []) out.push(t);
  return out.filter((t, i) => out.findIndex(x => x.replace(/\s/g, '') === t.replace(/\s/g, '')) === i);  // 「국군의날」·「국군의 날」 겹침 제거
}
const anniOf = k => (!holidayOf(k) && grayOf(k).join('·')) || '';
// 날짜 창에 보일 «전체 이름» — 칸에선 잘려도 여기선 다 보인다(빨간 날 + 기념일 모두)
function dayLabels(k) {
  const c = S.calHol[k];
  const red = S.holidays[k] ? [S.holidays[k]] : c && c.red.length ? c.red : HOLIDAYS[k] ? [HOLIDAYS[k]] : [];
  return { red, gray: grayOf(k) };
}

function patternShift(p, k) {
  if (!p || !p.pattern || !p.pattern.length || !p.start) return '';
  const L = p.pattern.length;
  return p.pattern[(((dayNum(k) - dayNum(p.start)) % L) + L) % L];
}
function shiftOf(p, k) {
  if (!p) return '';
  if (p.overrides && Object.prototype.hasOwnProperty.call(p.overrides, k)) return p.overrides[k];
  return patternShift(p, k);
}

function badge(id, size = '') {
  const t = typeOf(id);
  if (!t) return '';
  const c = safeColor(t.color);
  if (t.kind === 'fill') return `<span class="b fill ${size}" style="background:${c};color:${textOn(c)}">${esc(t.label)}</span>`;
  return `<span class="b text ${size}" style="color:${c}">${esc(t.label)}</span>`;
}

// ---------- 화면: 내 달력 ----------
function monthFrame() {
  const { y, m } = view;
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  return { y, m, startNum: dayNum(keyOf(y, m, 1)) - first, weeks: Math.ceil((first + days) / 7) };
}

function renderCal() {
  const { m, startNum, weeks } = monthFrame();
  const p = me(), tk = todayKey();
  let html = '';
  for (let i = 0; i < weeks * 7; i++) {
    const k = keyFromNum(startNum + i), { d, m: mm } = parseKey(k), dow = i % 7, hol = holidayOf(k), anni = anniOf(k);
    const sh = shiftOf(p, k), memos = memosOf(k);
    const ov = p && p.overrides && Object.prototype.hasOwnProperty.call(p.overrides, k);
    const dc = hol ? 'holi' : dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';
    html += `<div class="cell${mm !== m ? ' out' : ''}${k === tk ? ' today' : ''}" data-k="${k}">
      <div class="dn ${dc}"><span>${d}</span>${hol ? `<span class="hol">${esc(hol)}</span>` : anni ? `<span class="hol anni">${esc(anni)}</span>` : ''}</div>
      <div class="sh">${badge(sh)}${ov ? '<i class="ov"></i>' : ''}</div>
      ${memos.map(mm => `<div class="memo${memos.length > 1 ? ' one' : ''}"${memoStyle(mm.c)}>${esc(mm.t)}</div>`).join('')}</div>`;
  }
  const g = $('#grid');
  g.innerHTML = html;
  g.style.gridTemplateRows = `repeat(${weeks}, minmax(0, 1fr))`;
  g.classList.toggle('w6', weeks === 6);
  renderStats();
}

function renderStats() {
  const p = me();
  if (!p) { $('#stats').innerHTML = ''; return; }
  const { y, m } = view, days = new Date(y, m + 1, 0).getDate(), cnt = {};
  for (let d = 1; d <= days; d++) { const s = shiftOf(p, keyOf(y, m, d)); if (s) cnt[s] = (cnt[s] || 0) + 1; }
  $('#stats').innerHTML = `<span class="t">${m + 1}월</span>` +
    S.types.filter(t => cnt[t.id]).map(t => `<span class="st">${badge(t.id, 'sm')}<b>${cnt[t.id]}</b></span>`).join('');
}

function renderTeam() {
  const { m, startNum, weeks } = monthFrame();
  const list = S.people, tk = todayKey();  // 저장된 순서 그대로(이름 길게 눌러 끌어서 바꿈)
  let html = '';
  for (let w = 0; w < weeks; w++) {
    html += '<div class="tw"><div class="trow head"><div class="tname"></div>';
    for (let i = 0; i < 7; i++) {
      const k = keyFromNum(startNum + w * 7 + i), { d, m: mm } = parseKey(k), hol = holidayOf(k), anni = anniOf(k);
      const c = hol || i === 0 ? 'sun' : i === 6 ? 'sat' : '';
      html += `<div class="th ${c}${mm !== m ? ' out' : ''}${k === tk ? ' today' : ''}" data-k="${k}">${d}${hol ? `<small>${esc(hol)}</small>` : anni ? `<small class="anni">${esc(anni)}</small>` : ''}</div>`;
    }
    html += '</div>';
    for (const p of list) {
      html += `<div class="trow${p.me ? ' mine' : ''}"><div class="tname" data-pid="${p.id}">${esc(p.name)}</div>`;
      for (let i = 0; i < 7; i++) {
        const k = keyFromNum(startNum + w * 7 + i), { m: mm } = parseKey(k);
        html += `<div class="tc${mm !== m ? ' out' : ''}${k === tk ? ' today' : ''}" data-pid="${p.id}" data-k="${k}">${badge(shiftOf(p, k), 'sm')}</div>`;
      }
      html += '</div>';
    }
    html += '</div>';
  }
  if (!others().length) html += '<div class="empty">아래 「+ 근무자 추가」로 다른 사람 근무표를 넣거나,<br>설정 → 「공유 코드로 근무자 추가」로 받은 코드를 붙여넣으세요.</div>';
  else html += '<p class="team-hint">이름을 길게 누른 채 위아래로 끌면 순서가 바뀌어요 · 이름을 짧게 누르면 수정</p>';
  $('#team').innerHTML = html;
}

let sheetClick = null, sheetLocked = false, sheetTimer = 0, sheetBeforeClose = null;
// beforeClose: 「완료」가 아니라 뒤로 가기·바깥 터치로 닫혀도 꼭 할 일(날짜 창 = 메모 저장 · 10-09 쓰던 메모가 사라짐)
function openSheet(html, onClick, locked = false, beforeClose = null) {

function closeSheet() {

// 날짜 시트 — 근무 바꾸기 · 메모 · 휴일 표시
function openDay(k, pid) {
  const p = pid ? S.people.find(x => x.id === pid) : me();
  if (!p) return;
  const { m, d } = parseKey(k), lb = dayLabels(k);
  // 메모는 하루 최대 MEMO_MAX 개(10-18) — 창 안에서는 items(작업본)를 고치고, 닫힐 때 commitDay 가 S 에 쓴다
  let items = memosOf(k).map(mm => ({ t: mm.t, c: mm.c || '' }));
  if (p.me && !items.length) items.push({ t: '', c: S.lastMemoColor || '' });
  const base = patternShift(p, k), cur = shiftOf(p, k);
  const ov = p.overrides && Object.prototype.hasOwnProperty.call(p.overrides, k);
  const bt = typeOf(base);
  openSheet(`
    <div class="sh-title">${m + 1}월 ${d}일 (${DOW[dowOf(k)]})${p.me ? '' : `<span class="who">${esc(p.name)}</span>`}</div>
    ${lb.red.length + lb.gray.length ? `<div class="tags">${lb.red.map(t => `<span class="tag">${esc(t)}</span>`).join('')}${lb.gray.map(t => `<span class="tag gray">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="lbl">근무 ${ov ? '<span class="badge-ov">바꾼 날</span>' : ''}</div>
    <div class="types">
      ${S.types.map(t => `<button class="tbtn${cur === t.id ? ' sel' : ''}" data-t="${t.id}">${badge(t.id, 'sm')}<span>${esc(t.name)}</span></button>`).join('')}
      <button class="tbtn${cur === '' ? ' sel' : ''}" data-t=""><span class="none">–</span><span>없음</span></button>
    </div>
    ${ov ? `<button class="link" data-act="resetOv">↺ 패턴대로 되돌리기 (${bt ? esc(bt.name) : '없음'})</button>` : ''}
    ${p.me ? `
    <div class="lbl">메모 <span class="sub">하루 ${MEMO_MAX}개까지 · 메모마다 색</span></div>
    <div id="memoList"></div>
    <details style="margin-top:12px"><summary class="sub">휴일 직접 표시</summary>
      <input type="text" id="dayHol" style="margin-top:8px" placeholder="${HOLIDAYS[k] ? esc(HOLIDAYS[k]) + ' (기본)' : '예: 창립기념일'}" value="${esc(S.holidays[k] || '')}" maxlength="10">
    </details>` : ''}
    <div class="actions"><button class="primary" data-act="done">완료</button></div>`,
  e => {
    const tb = e.target.closest('[data-t]'), act = e.target.closest('[data-act]')?.dataset.act;
    const mb = e.target.closest('[data-mc]');
    if (mb) {  // 메모 색 — 그 메모만, 창은 그대로
      syncMemos(); items[+mb.dataset.i].c = mb.dataset.mc; renderMemoList();
      return;
    }
    if (act === 'addMemo') {
      syncMemos(); items.push({ t: '', c: S.lastMemoColor || '' }); renderMemoList();
      const tas = document.querySelectorAll('#memoList .dm'); tas[tas.length - 1]?.focus();
      return;
    }
    if (act === 'delMemo') {
      syncMemos();
      const i = +e.target.closest('[data-act]').dataset.i;
      if (items[i].t.trim() && !confirm('이 메모를 지울까요?')) return;
      items.splice(i, 1);
      if (!items.length) items.push({ t: '', c: S.lastMemoColor || '' });
      // 🔴 화면을 먼저 다시 그린 뒤 저장 — commitDay 가 화면 글자를 다시 읽으므로, 옛 화면이면 글자가 한 칸씩 밀린다
      renderMemoList(); commitDay(k); save(); render(); toast('메모를 지웠어요');
      return;
    }
    if (tb) {
      const t = tb.dataset.t;
      p.overrides = p.overrides || {};
      if (t === base) delete p.overrides[k]; else p.overrides[k] = t;
      commitDay(k); save(); render(); openDay(k, pid);
    } else if (act === 'resetOv') {
      delete p.overrides[k]; commitDay(k); save(); render(); openDay(k, pid);
    } else if (act === 'done') closeSheet();  // 저장은 beforeClose 가
  }, false, () => { commitDay(k); save(); });
  renderMemoList();

  function syncMemos() {  // 화면의 글자 → items
    document.querySelectorAll('#memoList .dm').forEach(ta => { const it = items[+ta.dataset.i]; if (it) it.t = ta.value; });
  }
  function renderMemoList() {
    const box = $('#memoList'); if (!box) return;
    box.innerHTML = items.map((mm, i) => `<div class="memo-item">
        <textarea class="dm" data-i="${i}" placeholder="${i ? '메모 ' + (i + 1) : '예: 회식 7시, 병원 예약'}"${memoStyle(mm.c, true)}>${esc(mm.t)}</textarea>
        <div class="mrow">
          <div class="mcolors">${MEMO_COLORS.map(c => `<button class="mc${c.id === mm.c ? ' on' : ''}" data-mc="${c.id}" data-i="${i}" title="${c.name}" aria-label="${c.name}" style="${c.id ? `background:${c.hex}` : ''}">${c.id ? '' : '기본'}</button>`).join('')}</div>
          ${items.length > 1 || mm.t.trim() ? `<button class="memo-del" data-act="delMemo" data-i="${i}" aria-label="이 메모 지우기">🗑</button>` : ''}
        </div></div>`).join('')
      + (items.length < MEMO_MAX ? '<button class="memo-add" data-act="addMemo">+ 메모 추가</button>' : '');
  }
  function commitDay(key) {
    const ht = $('#dayHol');
    if ($('#memoList')) {
      syncMemos();
      const list = items.map(mm => ({ t: mm.t.trim(), c: mm.c || '' })).filter(mm => mm.t);
      if (list.length) { S.memos[key] = list; S.lastMemoColor = list[list.length - 1].c; } else delete S.memos[key];
    }
    if (ht) { const v = ht.value.trim(); if (v) S.holidays[key] = v; else delete S.holidays[key]; }
  }
}

// 패턴 편집 — 나 / 근무자 추가·수정
let PD = null;
function openPattern(pid, first = false) {
  const p = pid ? S.people.find(x => x.id === pid) : null, m0 = me();
  PD = {
    pid, first, isMe: p ? !!p.me : !m0,

function renderPattern() {
  const tk = todayKey(), L = PD.seq.length, m0 = me();

  openSheet(`

    ${PD.first ? '<p class="hint" style="margin-top:8px">반복되는 근무 순서를 한 번만 넣으면 달력에 계속 채워져요. 나중에 설정에서 바꿀 수 있어요.</p>' : ''}

    <div class="seq">${PD.seq.map((id, i) => `<button class="it" data-del="${i}">${badge(id, 'sm')}<span>${i + 1}</span></button>`).join('') || '<span class="sub" style="padding:0 6px">아래 근무를 눌러 순서대로 추가</span>'}</div>
    <div class="types" style="margin-top:8px">${S.types.map(t => `<button class="tbtn" data-add="${t.id}">${badge(t.id, 'sm')}<span>+ ${esc(t.name)}</span></button>`).join('')}</div>
    ${L ? `<div class="lbl">오늘(${md(tk)} ${DOW[dowOf(tk)]})은 몇 번째 날?</div>
    <div class="seq">${PD.seq.map((id, i) => `<button class="it${i === tIdx ? ' on' : ''}" data-today="${i}">${badge(id, 'sm')}<span>${i + 1}</span></button>`).join('')}</div>` : ''}
    ${!PD.isMe && m0 ? `<div class="lbl">내 근무 기준으로 밀기</div>
    <div class="chips"><button class="chip" data-off="-1">◀ 하루 앞당기기</button><button class="chip" data-off="1">하루 미루기 ▶</button></div>` : ''}
    <div class="lbl">미리보기 <span class="sub">오늘부터 2주${!PD.isMe && m0 ? ' · 아래 줄 = 나' : ''}</span></div>
    <div class="pv">${pv}</div>
    <div class="actions">
      ${PD.first ? '' : '<button class="ghost" data-act="cancel">취소</button>'}
      ${PD.pid && !PD.isMe ? '<button class="ghost danger" data-act="del">삭제</button>' : ''}
      <button class="primary" data-act="save">저장</button>
    </div>`, onPatternClick, PD.first);
  $('#pName').addEventListener('input', e => { PD.name = e.target.value; });

function onPatternClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  const ds = b.dataset;
  if (ds.preset !== undefined) PD.seq = [...PRESETS[+ds.preset].seq];
  else if (ds.add !== undefined) PD.seq.push(ds.add);
  else if (ds.del !== undefined) PD.seq.splice(+ds.del, 1);
  else if (ds.today !== undefined) PD.start = keyFromNum(dayNum(todayKey()) - +ds.today);
  else if (ds.off !== undefined) PD.start = keyFromNum(dayNum(PD.start) + +ds.off);
  else if (ds.act === 'cancel') return closeSheet();
  else if (ds.act === 'del') {
    if (!confirm(`「${PD.name}」 근무자를 지울까요?`)) return;
    S.people = S.people.filter(x => x.id !== PD.pid); save(); return closeSheet();
  } else if (ds.act === 'save') return savePattern();
  else return;
  renderPattern();
}
function savePattern() {
  const name = PD.name.trim() || (PD.isMe ? '나' : '');
  if (!name) return toast('이름을 넣어 주세요');
  if (!PD.seq.length) return toast('근무 순서를 하나 이상 넣어 주세요');
  const p = PD.pid ? S.people.find(x => x.id === PD.pid) : null;
  if (p) Object.assign(p, { name, pattern: [...PD.seq], start: PD.start });
  else S.people.push({ id: uid(), me: PD.isMe, name, pattern: [...PD.seq], start: PD.start, overrides: {} });
  const wasFirst = PD.first;
  save(); closeSheet(); toast('저장했어요');
  if (wasFirst) setTimeout(maybeAskCalendar, 400);
}

// ---------- 공유 · 백업 ----------
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));

function makeCode(p) {
  const from = dayNum(todayKey()) - 60, o = {};
  for (const [k, v] of Object.entries(p.overrides || {})) if (dayNum(k) >= from) o[k] = v;
  const used = new Set([...p.pattern, ...Object.values(o)]);
  const t = S.types.filter(x => used.has(x.id));
  return 'SC1.' + b64e(JSON.stringify({ n: p.name, q: p.pattern, s: p.start, o, t }));
}
function readCode(text) {
  const m = String(text).match(/SC1\.[A-Za-z0-9_-]+/);
  if (!m) throw new Error('코드를 찾지 못했어요');
  const d = JSON.parse(b64d(m[0].slice(4)));
  if (!d || !Array.isArray(d.q) || !d.s) throw new Error('코드가 깨졌어요');
  return d;
}
function shareMe() {
  const p = me(), code = makeCode(p);
  const text = `[근무달력] ${p.name} 근무표\n근무달력 → 설정 → 「공유 코드로 근무자 추가」에 붙여넣으세요.\n${code}`;
  openSheet(`
    <div class="sh-title">내 근무표 보내기</div>
    <p class="hint" style="margin-top:8px">패턴과 최근 바꾼 날짜가 들어 있어요. 근무를 또 바꾸면 다시 보내 주면 돼요.</p>
    <div class="codebox">${esc(code)}</div>
    <div class="actions"><button class="ghost" data-act="copy">복사</button>${NATIVE || navigator.share ? '<button class="primary" data-act="share">보내기</button>' : '<button class="primary" data-act="close">닫기</button>'}</div>`,
  async e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'copy') {
      if (NATIVE) { NATIVE.copy(text); toast('복사했어요'); return; }
      try { await navigator.clipboard.writeText(text); toast('복사했어요'); } catch { toast('길게 눌러 직접 복사하세요'); }
    }
    else if (act === 'share') {
      if (NATIVE) return NATIVE.share(text);
      try { await navigator.share({ title: '근무표 공유', text }); } catch {}
    }
    else if (act === 'close') closeSheet();
  });
}
function importCode() {
  openSheet(`
    <div class="sh-title">공유 코드로 근무자 추가</div>
    <p class="hint" style="margin-top:8px">받은 메시지를 통째로 붙여넣어도 돼요. 같은 이름이 있으면 새 내용으로 바뀝니다.</p>
    <textarea id="codeIn" placeholder="SC1.으로 시작하는 코드"></textarea>
    <div class="actions"><button class="ghost" data-act="cancel">취소</button><button class="primary" data-act="add">추가</button></div>`,
  e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') return closeSheet();
    if (act !== 'add') return;
    let d;
    try { d = readCode($('#codeIn').value); } catch (err) { return toast(err.message); }
    for (const t of d.t || []) if (!typeOf(t.id)) S.types.push({ id: t.id, label: t.label, name: t.name, color: safeColor(t.color), kind: t.kind === 'text' ? 'text' : 'fill' });
    const name = String(d.n || '이름 없음').slice(0, 20);
    const ex = others().find(x => x.name === name);
    const data = { name, pattern: d.q.map(String), start: d.s, overrides: d.o || {} };
    if (ex) Object.assign(ex, data); else S.people.push({ id: uid(), me: false, ...data });
    save(); closeSheet(); toast(`${name} 근무표를 ${ex ? '갱신' : '추가'}했어요`);
  });
}
function exportBackup() {
  const t = new Date(), name = `근무달력-백업-${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}.json`;
  S.lastBackupAt = Date.now(); save();
  const json = JSON.stringify(S, null, 1);
  if (NATIVE) return NATIVE.saveFile(name, json);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importBackup(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.people) || !Array.isArray(d.types)) throw 0;
    if (!confirm('지금 데이터를 백업 파일 내용으로 바꿀까요?')) return;
    S = migrateMemos(Object.assign(freshState(), d)); save(); render(); toast('불러왔어요');
  } catch { toast('백업 파일이 아니에요'); }
}

// ---------- 폰 캘린더 공휴일 ----------
// 캘린더마다 역할이 다르다(2026-10-04 사용자 폰에서 확인):
//   red   = 삼성 「공휴일」 — 전부 쉬는 날. 단 설·추석은 «당일»만 있고 연휴 날이 없다.
//   mixed = 구글 「대한민국의 휴일」 — 연휴·「쉬는 날 X」(=대체공휴일)가 있고, 어버이날 같은 기념일도 섞여 있다.
//   gray  = 「법정기념일」·「절기와 세시풍속」 등 — 쉬지 않는 날(회색 글씨). 이름에 「임시」가 있어도 빨간 날 아님.
const calRole = c => {
  const n = String(c.name || '').trim();
  if (/^공휴일$|^public holidays?$/i.test(n)) return 'red';
  if (/휴일|holiday/i.test(n)) return 'mixed';
  return 'gray';
};
// 처음 고를 캘린더 — 공휴일·휴일·기념일 캘린더(절기·세시풍속은 빼 둔다. 설정에서 켤 수 있음)
const calDefault = c => calRole(c) !== 'gray' || /기념일/.test(c.name || '');
const MIXED_RED_RE = /연휴|새해첫날|신정|설날|삼일절|노동절|어린이날|부처님오신날|석가탄신일|현충일|제헌절|광복절|추석|개천절|한글날|크리스마스|성탄절|기독탄신일|선거|임시공휴일|대체공휴일/;
function classify(role, title) {
  let t = title.trim();
  if (role === 'gray') return { red: false, t };
  if (/^쉬는\s*날/.test(t)) return { red: true, t: '대체공휴일' };  // 구글의 「쉬는 날 개천절」 = 대체공휴일
  if (role === 'red') return { red: true, t };
  return { red: !/이브|전야|그믐/.test(t) && MIXED_RED_RE.test(t.replace(/\s/g, '')), t };
}

function calList() {
  try { return JSON.parse(NATIVE.listCalendars()) || []; } catch (e) { return []; }
}
function syncCalendar() {
  if (!NATIVE || !NATIVE.calendarGranted()) return -1;
  const cals = calList(), role = {};
  for (const c of cals) role[String(c.id)] = calRole(c);
  if (!Array.isArray(S.calSel) || S.calSelV !== 2) { S.calSel = cals.filter(calDefault).map(c => String(c.id)); S.calSelV = 2; }
  const y = new Date().getFullYear();
  const from = Date.UTC(y - 1, 0, 1) - 86400000, to = Date.UTC(y + 4, 0, 1);
  let list = [];
  if (S.calSel.length) try { list = JSON.parse(NATIVE.readEvents(S.calSel.join(','), String(from), String(to))) || []; } catch (e) {}
  const rank = { red: 0, mixed: 1, gray: 2 };
  list.sort((a, b) => rank[role[String(a.c)] || 'gray'] - rank[role[String(b.c)] || 'gray']);  // 삼성 공휴일 이름이 먼저
  const map = {}, stat = {}, same = (arr, t) => arr.some(x => x.replace(/\s/g, '') === t.replace(/\s/g, ''));
  for (const e of list) {
    stat[e.c] = (stat[e.c] || 0) + 1;
    const day = map[e.d] || (map[e.d] = { red: [], other: [] });
    const { red, t } = classify(role[String(e.c)] || 'gray', e.t);
    const arr = red ? day.red : day.other;
    if (!same(arr, t)) arr.push(t);
  }
  S.calHol = map; S.calStat = stat; S.calAt = Date.now();
  save();
  return Object.keys(map).length;
}
// 처음 한 번만 권한을 묻는다(첫 패턴 설정이 끝난 뒤)
function maybeAskCalendar() {
  if (!NATIVE || S.calAsked) return;
  S.calAsked = true; save();
  if (NATIVE.calendarGranted()) { syncCalendar(); render(); } else NATIVE.requestCalendar();
}
window.onCalendarPermission = ok => {
  if (!ok) { toast('캘린더 권한이 없어 내장 공휴일만 써요'); render(); return; }
  const n = syncCalendar(); render();
  toast(S.calSel.length ? `폰 캘린더에서 ${n}일을 가져왔어요` : '공휴일 캘린더를 못 찾았어요 — 설정에서 골라 주세요');
};
window.onAppResume = () => {
  if (NATIVE && NATIVE.calendarGranted() && Array.isArray(S.calSel)) syncCalendar();
  if (!$('#sheetWrap').classList.contains('open')) render();
};

// ---------- 년·월 고르기 ----------
const WI = 44, YEARS = Array.from({ length: 21 }, (_, i) => 2020 + i);
function openMonthPicker() {
  const wheel = (id, items, fmt) => `<div class="wheel" id="${id}"><div class="sp"></div>${items.map((v, i) => `<div class="wi" data-i="${i}">${fmt(v)}</div>`).join('')}<div class="sp"></div></div>`;
  openSheet(`
    <div class="sh-title">년 · 월 선택</div>
    <div class="wheels">${wheel('wY', YEARS, v => v + '년')}${wheel('wM', [...Array(12).keys()], v => pad(v + 1) + '월')}<div class="wsel"></div></div>
    <div class="actions"><button class="ghost" data-act="thisMonth">이번 달</button><button class="ghost" data-act="cancel">취소</button><button class="primary" data-act="ok">완료</button></div>`,
  e => {
    const it = e.target.closest('.wi');
    if (it) return it.parentElement.scrollTo({ top: +it.dataset.i * WI, behavior: 'smooth' });
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') closeSheet();
    else if (act === 'thisMonth') { const t = new Date(); view = { y: t.getFullYear(), m: t.getMonth() }; closeSheet(); }
    else if (act === 'ok') { view = { y: YEARS[wheelIdx($('#wY'))], m: wheelIdx($('#wM')) }; closeSheet(); }
  });
  const yi = Math.max(0, YEARS.indexOf(view.y));
  for (const [w, i] of [[$('#wY'), yi], [$('#wM'), view.m]]) {
    w.scrollTop = i * WI; markWheel(w);
    w.addEventListener('scroll', () => markWheel(w), { passive: true });
  }
}
function wheelIdx(w) { return Math.max(0, Math.min(w.querySelectorAll('.wi').length - 1, Math.round(w.scrollTop / WI))); }
function markWheel(w) { const i = wheelIdx(w); w.querySelectorAll('.wi').forEach((el, j) => el.classList.toggle('on', j === i)); }

// ---------- 한 화면에 맞추기 ----------
// 키보드가 올라와 화면이 줄 때(메모 입력 중)는 줄이지 않는다 — 달력이 찌그러지지 않게
let fitH = 0;
function fitCal() {
  // 🔴 offsetHeight 는 정수로 반올림된다 — 폰(DPR 3.5)에선 머리줄·탭바가 56.4px 같은 소수라 합이 화면보다
  //    1px 미만 커져 스크롤이 생겼다(10-16 월별 메모 뺀 뒤). 소수 높이로 재고 내림 + 1px 여유.
  const tabsH = $('.tabs').getBoundingClientRect().height;
  document.body.style.paddingBottom = tabsH + 'px';
  const h = Math.floor(window.innerHeight - $('#top').getBoundingClientRect().height - tabsH) - 1;
  const typing = /^(TEXTAREA|INPUT)$/.test(document.activeElement?.tagName || '');
  if (typing && h < fitH) return;
  fitH = h;
  document.documentElement.style.setProperty('--calH', Math.max(h, 440) + 'px');
}
window.addEventListener('resize', fitCal);

// ---------- 이미지로 저장(📷) ----------
// 화면을 찍는 게 아니라 데이터로 «한 달 전체»를 캔버스에 새로 그린다 → 잘림 없음 · 다크 모드여도 밝은 이미지(남에게 보내기 좋게)
const IMG = { bg: '#ffffff', fg: '#1f2328', sub: '#8b9096', line: '#e3e5e8', sun: '#e5484d', sat: '#2f6fec', holbg: '#ffe1e5', soft: '#f4f5f7', mine: '#fff8d6' };
const IMG_FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
function fitText(x, s, w) {
  s = String(s);
  if (x.measureText(s).width <= w) return s;
  while (s && x.measureText(s + '…').width > w) s = s.slice(0, -1);
  return s ? s + '…' : '';
}
function wrapLines(x, s, w, max) {
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const ch of para) { if (line && x.measureText(line + ch).width > w) { out.push(line); line = ch; } else line += ch; }
    out.push(line);
  }
  if (out.length > max) { out.length = max; out[max - 1] = fitText(x, out[max - 1] + '……', w); }
  return out;
}
function newCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = IMG.bg; x.fillRect(0, 0, w, h); x.textBaseline = 'middle';
  return [c, x];
}
function rrect(x, l, t, w, h, r) { x.beginPath(); if (x.roundRect) x.roundRect(l, t, w, h, r); else x.rect(l, t, w, h); }
function drawBadge(x, id, cx, cy, r) {
  const t = typeOf(id); if (!t) return;
  const c = safeColor(t.color);
  x.textAlign = 'center';
  if (t.kind === 'fill') {
    x.fillStyle = c; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
    x.fillStyle = textOn(c); x.font = `800 ${Math.round(r * 0.95)}px ${IMG_FONT}`;
  } else { x.fillStyle = c; x.font = `800 ${Math.round(r * 1.15)}px ${IMG_FONT}`; }
  x.fillText(t.label, cx, cy + 1);
}
function drawFooter(x, W, H) {
  x.globalAlpha = 1; x.fillStyle = IMG.sub; x.font = `500 20px ${IMG_FONT}`; x.textAlign = 'right';
  x.fillText('근무달력', W - 28, H - 24);
}

function drawCal() {
  const { y, m, startNum, weeks } = monthFrame(), p = me();
  const W = 1080, P = 28, top = 120, dowH = 54, baseH = 178, cw = (W - P * 2) / 7, statsH = 80, foot = 48;
  // 메모 줄 미리 재기 — 하나면 2줄까지, 여럿이면 하나에 1줄씩(메모가 많은 주는 그 줄만 키운다)
  const mx = newCanvas(1, 1)[1]; mx.font = `500 19px ${IMG_FONT}`;
  const blocks = {}, rowH = Array(weeks).fill(baseH);
  for (let i = 0; i < weeks * 7; i++) {
    const k = keyFromNum(startNum + i), ms = p ? memosOf(k) : [];
    if (!ms.length) continue;
    const b = ms.map(mm => ({ c: memoColor(mm.c), lines: wrapLines(mx, mm.t, cw - 22, ms.length > 1 ? 1 : 2) }));
    blocks[k] = b;
    const h = b.reduce((s, bb) => s + bb.lines.length * 24 + 8, 0) + 4 * (b.length - 1);
    const w = Math.floor(i / 7); rowH[w] = Math.max(rowH[w], 128 + h + 10);
  }
  const rowY = rowH.reduce((a, h, i) => (a.push(a[i] + h), a), [0]);  // 각 주의 위쪽(누적)
  const gridH = rowY[weeks];
  const H = top + dowH + gridH + statsH + foot;
  const [c, x] = newCanvas(W, H);
  x.textAlign = 'left'; x.fillStyle = IMG.fg; x.font = `800 50px ${IMG_FONT}`; x.fillText(`${y}년 ${m + 1}월`, P, 64);
  x.textAlign = 'right'; x.fillStyle = IMG.sub; x.font = `600 28px ${IMG_FONT}`; x.fillText(`${p ? p.name : ''} 근무표`, W - P, 66);
  [...DOW].forEach((d, i) => {
    x.fillStyle = i === 0 ? IMG.sun : i === 6 ? IMG.sat : IMG.sub; x.font = `600 26px ${IMG_FONT}`; x.textAlign = 'center';
    x.fillText(d, P + cw * i + cw / 2, top + dowH / 2);
  });
  const gy = top + dowH;
  for (let i = 0; i < weeks * 7; i++) {
    const k = keyFromNum(startNum + i), { d, m: mm } = parseKey(k), dow = i % 7;
    const cx = P + cw * dow, cy = gy + rowY[Math.floor(i / 7)], hol = holidayOf(k), anni = anniOf(k);
    x.globalAlpha = mm !== m ? 0.35 : 1;
    if (hol) { x.fillStyle = IMG.holbg; rrect(x, cx + 5, cy + 6, cw - 10, 38, 8); x.fill(); }
    x.textAlign = 'left'; x.font = `700 28px ${IMG_FONT}`;
    x.fillStyle = hol || dow === 0 ? IMG.sun : dow === 6 ? IMG.sat : IMG.fg;
    x.fillText(String(d), cx + 12, cy + 26);
    const nw = x.measureText(String(d)).width;
    const lab = hol || anni;
    if (lab) {
      x.font = `500 18px ${IMG_FONT}`; x.fillStyle = hol ? IMG.sun : IMG.sub; x.textAlign = 'right';
      x.fillText(fitText(x, lab, cw - nw - 30), cx + cw - 10, cy + 26);
    }
    drawBadge(x, shiftOf(p, k), cx + cw / 2, cy + 84, 36);
    let by = cy + 128;
    x.font = `500 19px ${IMG_FONT}`;
    for (const b of blocks[k] || []) {
      const bh = b.lines.length * 24 + 8;
      x.fillStyle = b.c ? b.c.hex + '55' : IMG.soft; rrect(x, cx + 6, by, cw - 12, bh, 6); x.fill();
      if (b.c) { x.fillStyle = b.c.hex; x.fillRect(cx + 6, by, 4, bh); }
      x.fillStyle = IMG.fg; x.textAlign = 'left';
      b.lines.forEach((ln, j) => x.fillText(ln, cx + 14, by + 16 + j * 24));
      by += bh + 4;
    }
  }
  x.globalAlpha = 1; x.strokeStyle = IMG.line; x.lineWidth = 2;
  for (let r = 0; r <= weeks; r++) { x.beginPath(); x.moveTo(P, gy + rowY[r]); x.lineTo(W - P, gy + rowY[r]); x.stroke(); }
  for (let col = 1; col < 7; col++) { x.beginPath(); x.moveTo(P + cw * col, gy); x.lineTo(P + cw * col, gy + gridH); x.stroke(); }
  // 이달 근무 수
  if (p) {
    const days = new Date(y, m + 1, 0).getDate(), cnt = {};
    for (let d = 1; d <= days; d++) { const s = shiftOf(p, keyOf(y, m, d)); if (s) cnt[s] = (cnt[s] || 0) + 1; }
    let sx = P, sy = gy + gridH + statsH / 2;
    x.textAlign = 'left'; x.fillStyle = IMG.sub; x.font = `600 24px ${IMG_FONT}`; x.fillText(`${m + 1}월`, sx, sy); sx += 70;
    for (const t of S.types) {
      if (!cnt[t.id]) continue;
      drawBadge(x, t.id, sx + 20, sy, 20);
      x.textAlign = 'left'; x.fillStyle = IMG.fg; x.font = `700 26px ${IMG_FONT}`; x.fillText(String(cnt[t.id]), sx + 48, sy);
      sx += 48 + x.measureText(String(cnt[t.id])).width + 30;
    }
  }
  drawFooter(x, W, H);
  return c;
}

function drawTeam() {
  const { y, m, startNum, weeks } = monthFrame(), list = S.people;
  const W = 1080, P = 20, nameW = 172, cw = (W - P * 2 - nameW) / 7, top = 110, headH = 52, rowH = 76, gap = 18, foot = 48;
  const H = top + weeks * (headH + list.length * rowH + gap) + foot;
  const [c, x] = newCanvas(W, H);
  x.textAlign = 'left'; x.fillStyle = IMG.fg; x.font = `800 48px ${IMG_FONT}`; x.fillText(`${y}년 ${m + 1}월 근무표`, P + 4, 60);
  let yy = top;
  for (let w = 0; w < weeks; w++) {
    x.globalAlpha = 1; x.fillStyle = IMG.soft; x.fillRect(P, yy, W - P * 2, headH);
    for (let i = 0; i < 7; i++) {
      const k = keyFromNum(startNum + w * 7 + i), { d, m: mm } = parseKey(k), hol = holidayOf(k), cx = P + nameW + cw * i;
      x.globalAlpha = mm !== m ? 0.35 : 1;
      x.fillStyle = hol || i === 0 ? IMG.sun : i === 6 ? IMG.sat : IMG.fg;
      x.font = `700 24px ${IMG_FONT}`;
      if (hol) {
        x.textAlign = 'left'; x.fillText(String(d), cx + 8, yy + headH / 2);
        const nw = x.measureText(String(d)).width;
        x.font = `500 15px ${IMG_FONT}`; x.fillText(fitText(x, hol, cw - nw - 18), cx + 12 + nw, yy + headH / 2 + 1);
      } else { x.textAlign = 'center'; x.fillText(String(d), cx + cw / 2, yy + headH / 2); }
    }
    yy += headH;
    for (const p of list) {
      x.globalAlpha = 1;
      if (p.me) { x.fillStyle = IMG.mine; x.fillRect(P, yy, W - P * 2, rowH); }
      x.fillStyle = IMG.fg; x.font = `600 24px ${IMG_FONT}`; x.textAlign = 'left';
      x.fillText(fitText(x, p.name, nameW - 20), P + 10, yy + rowH / 2);
      for (let i = 0; i < 7; i++) {
        const k = keyFromNum(startNum + w * 7 + i), { m: mm } = parseKey(k);
        x.globalAlpha = mm !== m ? 0.35 : 1;
        drawBadge(x, shiftOf(p, k), P + nameW + cw * i + cw / 2, yy + rowH / 2, 26);
      }
      x.globalAlpha = 1; x.strokeStyle = IMG.line; x.lineWidth = 1.5;
      x.beginPath(); x.moveTo(P, yy + rowH); x.lineTo(W - P, yy + rowH); x.stroke();
      yy += rowH;
    }
    x.strokeStyle = IMG.line; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(P + nameW, yy - list.length * rowH - headH); x.lineTo(P + nameW, yy); x.stroke();
    yy += gap;
  }
  drawFooter(x, W, H);
  return c;
}

async function openShot() {
  const isTeam = tab === 'team';
  if (isTeam ? !S.people.length : !me()) return toast('먼저 근무를 넣어 주세요');
  const cv = isTeam ? drawTeam() : drawCal();
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return toast('이미지를 만들지 못했어요');
  const name = `근무표-${view.y}${pad(view.m + 1)}${isTeam ? '-근무자' : ''}.png`;
  const file = new File([blob], name, { type: 'image/png' });
  const url = URL.createObjectURL(blob);
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  openSheet(`
    <div class="sh-title">이미지로 저장 <span class="who">${view.y}년 ${view.m + 1}월 · ${isTeam ? '근무자 전체' : '내 달력'}</span></div>
    <img class="shot" src="${url}" alt="근무표 이미지">
    <div class="actions">
      <button class="ghost" data-act="dl">기기에 저장</button>
      ${canShare ? '<button class="primary" data-act="share">보내기 · 갤러리 저장</button>' : ''}
    </div>`,
  async e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'share') { try { await navigator.share({ files: [file], title: name }); } catch (err) {} }
    else if (act === 'dl') {
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); toast('다운로드 폴더에 저장했어요');
    }
  }, false, () => setTimeout(() => URL.revokeObjectURL(url), 1000));
}

// ---------- 근무자 순서 바꾸기: 이름 길게 누르기(0.45초) → 위아래로 끌기 → 놓으면 저장 ----------
// 손가락이 0.45초 안에 움직이면 평범한 스크롤로 본다. 끄는 동안만 화면 스크롤을 막는다.
let drag = null, dragEndedAt = 0;
function dragBegin(n, x, y) {
  dragCancel();
  drag = { pid: n.dataset.pid, block: n.closest('.tw'), x, y, active: false };
  drag.timer = setTimeout(() => {
    if (!drag) return;
    drag.active = true; tx = null;  // 달 넘기기 스와이프로 읽히지 않게
    drag.row = n.closest('.trow');
    drag.row.classList.add('dragrow'); document.body.classList.add('dragging');

}
function dragMove(x, y) {
  if (!drag) return false;
  if (!drag.active) { if (Math.hypot(x - drag.x, y - drag.y) > 10) dragCancel(); return false; }
  const rows = [...drag.block.querySelectorAll('.trow:not(.head)')].filter(r => r !== drag.row);
  const before = rows.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
  if (before) { if (drag.row.nextElementSibling !== before) drag.block.insertBefore(drag.row, before); }
  else if (drag.row !== drag.block.lastElementChild) drag.block.appendChild(drag.row);
  return true;
}
function dragFinish() {
  if (!drag) return false;
  const wasActive = drag.active;
  if (wasActive) {
    const order = [...drag.block.querySelectorAll('.trow:not(.head) .tname')].map(n => n.dataset.pid);
    const moved = order.join() !== S.people.map(p => p.id).join();
    S.people = order.map(id => S.people.find(p => p.id === id)).filter(Boolean);
    dragEndedAt = Date.now();
    if (moved) { save(); toast('순서를 바꿨어요'); }
  }
  dragCancel();
  if (wasActive) render();
  return wasActive;
}
function dragCancel() {
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.row) drag.row.classList.remove('dragrow');
  document.body.classList.remove('dragging');
  drag = null;
}
const teamEl = $('#team');
teamEl.addEventListener('touchstart', e => { const n = e.target.closest('.tname[data-pid]'); if (n && e.touches.length === 1) dragBegin(n, e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
teamEl.addEventListener('touchmove', e => { if (drag && dragMove(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault(); }, { passive: false });
teamEl.addEventListener('touchend', e => { if (dragFinish()) e.preventDefault(); }, { passive: false });
teamEl.addEventListener('touchcancel', dragCancel);
// 길게 누를 때 뜨는 메뉴(복사·웹 검색) 막기 — 입력 칸은 그대로
document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });
document.addEventListener('selectstart', e => { if (!e.target.closest || !e.target.closest('input,textarea')) e.preventDefault(); });
// PC 마우스로도 같은 동작
teamEl.addEventListener('mousedown', e => { const n = e.target.closest('.tname[data-pid]'); if (n && e.button === 0) dragBegin(n, e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (drag) dragMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { dragFinish(); });

$('#team').addEventListener('click', e => {
  if (Date.now() - dragEndedAt < 400) return;  // 끌기를 마친 손을 「이름 누름」으로 보지 않게
  const n = e.target.closest('.tname[data-pid]'); if (n) return openPattern(n.dataset.pid);
  const c = e.target.closest('.tc'); if (c) return openDay(c.dataset.k, c.dataset.pid);
  const h = e.target.closest('.th'); if (h) openDay(h.dataset.k);  // 날짜 줄을 누르면 내 날짜 창(전체 이름)
});
$('#addPerson').onclick = () => openPattern(null);
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) importBackup(f); else toast('파일을 고르지 않았어요');
});

$('#settings').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'editMe') openPattern(me().id);
  else if (act === 'addType') { S.types.push({ id: uid(), label: '?', name: '새 근무', color: '#7C5CFF', kind: 'fill' }); save(); render(); }
  else if (act === 'delType') {
    const id = b.closest('[data-tid]').dataset.tid;
    if (S.people.some(p => p.pattern.includes(id))) return toast('패턴에 들어 있는 종류는 지울 수 없어요');
    if (!confirm('이 근무 종류를 지울까요?')) return;
    S.types = S.types.filter(t => t.id !== id); save(); render();
  }
  else if (act === 'calConnect') { S.calAsked = true; save(); NATIVE.requestCalendar(); }
  else if (act === 'webHol') fetchWebHolidays(true);
  else if (act === 'calSync') { const n = syncCalendar(); render(); toast(`${n}일을 가져왔어요`); }
  else if (act === 'shareMe') shareMe();
  else if (act === 'importCode') importCode();
  else if (act === 'export') exportBackup();
  else if (act === 'import') $('#importFile').click();
  else if (act === 'reset') {
    if (!confirm('모든 근무·메모·근무자를 지울까요? 되돌릴 수 없어요.')) return;
    S = freshState(); save(); openPattern(null, true); render();
  }
});
$('#settings').addEventListener('change', e => {
  if (e.target.classList.contains('f-extra')) {
    S.extraShow = Object.assign({}, S.extraShow, { [e.target.value]: e.target.checked });
    save(); return;  // 설정 화면은 그대로 두고, 달력으로 돌아갈 때 반영
  }
  if (e.target.classList.contains('f-cal')) {
    S.calSel = [...document.querySelectorAll('.f-cal:checked')].map(x => x.value);
    syncCalendar(); render(); return;
  }
  const row = e.target.closest('[data-tid]'); if (!row) return;
  const t = typeOf(row.dataset.tid); if (!t) return;
  const v = e.target.value;
  if (e.target.classList.contains('f-label')) t.label = v.trim().slice(0, 2) || t.label;
  else if (e.target.classList.contains('f-name')) t.name = v.trim() || t.name;
  else if (e.target.classList.contains('f-color')) t.color = safeColor(v);
  else if (e.target.classList.contains('f-kind')) t.kind = v === 'text' ? 'text' : 'fill';
  save(); render();
});

// 좌우로 밀어 달 넘기기
let tx = null, ty = 0;
$('#main').addEventListener('touchstart', e => { if (tab === 'set') return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#main').addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 50) moveMonth(dx < 0 ? 1 : -1);
}, { passive: true });

// 뒤로 가기 — 열린 창이 있으면 (저장하고) 닫기만. false 면 「종료할까요?」
//   앱: MainActivity.onBackPressed 가 부르고, false 면 네이티브 확인 창
//   웹앱: 아래 history 가드가 부른다
window.onAndroidBack = () => {
  if ($('#sheetWrap').hidden || !$('#sheetWrap').classList.contains('open')) return false;
  if (!sheetLocked) closeSheet();
  return true;
};
if (!NATIVE) {
  // 설치한 웹앱은 기록이 하나뿐이라 뒤로 가기 = 즉시 종료 → 가드 기록을 하나 얹어 두고 popstate 에서 가로챈다.
  // 크롬은 «사용자 조작 없이» 쌓은 기록을 건너뛰므로 가드는 터치·키 입력 때 얹는다.
  const arm = () => { if (!history.state || history.state.sc !== 'guard') history.pushState({ sc: 'guard' }, ''); };
  document.addEventListener('pointerdown', arm, true);
  document.addEventListener('keydown', arm, true);
  window.addEventListener('popstate', () => {
    if (history.state && history.state.sc === 'guard') return;
    if (window.onAndroidBack()) { arm(); return; }
    if (confirm('근무달력을 종료할까요?')) history.back(); else arm();
  });
}

// ---------- 웹앱: 공휴일 표 받아 오기 ----------
// holidays.json = tools/fetch_holidays.py 결과(GitHub Actions 가 하루 한 번 갱신). 앱(NATIVE)은 폰 캘린더를 쓰므로 안 받는다.
async function fetchWebHolidays(manual = false) {
  if (NATIVE) return;
  if (!manual && S.webHolAt && Date.now() - S.webHolAt < 6 * 3600000) return;
  try {
    const r = await fetch('holidays.json', { cache: 'no-cache' });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!d || !d.days || Object.keys(d.days).length < 50) throw 0;
    S.calHol = d.days; S.webHolAt = Date.now(); save();
    if (!$('#sheetWrap').classList.contains('open')) render();
    if (manual) toast(`공휴일 ${Object.keys(d.days).length}일을 받아 왔어요`);
  } catch (e) { if (manual) toast('공휴일을 받지 못했어요 — 인터넷 연결을 확인하세요'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fetchWebHolidays(); });
async function fetchExtras() {  // 작은 고정 파일 — 저장하지 않고 열 때마다 받는다(오프라인이면 서비스워커 캐시)
  if (NATIVE) return;
  try {
    const r = await fetch('extras.json');
    if (r.ok) { EXTRAS = (await r.json()).days || {}; if (!$('#sheetWrap').classList.contains('open')) render(); }
  } catch (e) {}
}

// 아이폰 사파리는 user-scalable=no 를 무시하므로 두 손가락 확대 제스처를 직접 막는다
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });

// ---------- 시작 ----------
if (!S) S = freshState();
fitCal();
if (NATIVE && NATIVE.calendarGranted() && Array.isArray(S.calSel)) syncCalendar();
render();
if (!me()) openPattern(null, true);
else maybeAskCalendar();
if (!NATIVE) {
  fetchWebHolidays();
  fetchExtras();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}  // 크롬이 저장소를 함부로 비우지 않게
  // 한 달 넘게 백업이 없으면 한 번 알려 준다
  if (me() && (!S.lastBackupAt || Date.now() - S.lastBackupAt > 30 * 86400000) && (!S.backupNagAt || Date.now() - S.backupNagAt > 7 * 86400000)) {
    S.backupNagAt = Date.now(); save();
    setTimeout(() => toast('한 달 넘게 백업이 없어요 — 설정 → 백업 파일 저장'), 1500);
  }
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
